version: '3.8'

services:
  linkmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkmanager-app
    ports:
      - "8082:8082"
    volumes:
      - ./data:/root/data
    environment:
      - GIN_MODE=release
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/api-docs/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
